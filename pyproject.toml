[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant-mvp"
version = "0.1.0"
description = "Point-in-time multi-factor A-share research and monthly ranking"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "lightgbm==4.6.0", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
public = ["baostock>=0.9.4,<1"]

[project.scripts]
ashare-quant = "ashare_mvp.cli:main"

[tool.setuptools.packages.find]
include = ["ashare_mvp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
